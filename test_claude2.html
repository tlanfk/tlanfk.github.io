<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versus — 오늘의 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --white: #ffffff;
  --off: #fafaf8;
  --s50: #f7f6f3;
  --s100: #eeede9;
  --s200: #dddbd4;
  --s400: #a8a49a;
  --s600: #6b6760;
  --s800: #2c2b27;
  --ink: #1a1917;
  --coral: #e8614a;
  --sage: #7a9e7e;
  --warm: #d4956a;
  --lav: #9b8ec4;
  --r: 20px;
}
html { scroll-behavior: smooth; }
body {
  background: var(--off);
  color: var(--ink);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--s100); }
::-webkit-scrollbar-thumb { background: var(--s400); border-radius: 2px; }

/* NAV */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px;
  background: rgba(250,250,248,0.9);
  backdrop-filter: blur(24px) saturate(1.5);
  border-bottom: 1px solid var(--s100);
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 21px; font-weight: 700; letter-spacing: -0.5px;
  color: var(--ink); cursor: pointer; user-select: none;
}
.logo em { font-style: italic; color: var(--coral); }
.nav-pills { display: flex; gap: 2px; }
.npill {
  padding: 7px 16px; border-radius: 50px;
  background: none; border: none;
  font-family: inherit; font-size: 13.5px; font-weight: 500;
  color: var(--s600); cursor: pointer; transition: all .2s;
}
.npill:hover { color: var(--ink); background: var(--s100); }
.npill.on { background: var(--ink); color: #fff; }

/* MOBILE NAV */
.mnav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 900;
  background: rgba(250,250,248,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--s100);
  grid-template-columns: repeat(4,1fr);
  padding: 6px 0 max(8px, env(safe-area-inset-bottom));
}
.mbtn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; cursor: pointer; padding: 6px 4px;
  font-family: inherit; transition: .18s;
}
.mbtn .mi { font-size: 21px; }
.mbtn .ml { font-size: 10px; font-weight: 600; color: var(--s400); letter-spacing: .2px; }
.mbtn.on .ml { color: var(--ink); }
.mbtn.on .mi { transform: scale(1.1); }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* ANIM */
@keyframes up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.aup { animation: up .36s ease both; }
.d1 { animation-delay: .06s; } .d2 { animation-delay: .11s; }
.d3 { animation-delay: .16s; } .d4 { animation-delay: .22s; }

/* ── HOME ── */
.hero {
  max-width: 1080px; margin: 0 auto;
  padding: 96px 40px 48px;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 56px; align-items: center;
}
.h-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px;
  text-transform: uppercase; color: var(--coral); margin-bottom: 18px;
}
.h-eyebrow::before { content:''; display:block; width:24px; height:1.5px; background:var(--coral); }
.h-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(36px, 4vw, 60px);
  line-height: 1.1; letter-spacing: -1.5px;
  margin-bottom: 18px;
}
.h-title em { font-style: italic; color: var(--coral); }
.h-body { font-size: 15px; line-height: 1.8; color: var(--s600); margin-bottom: 32px; }
.h-ctas { display: flex; gap: 10px; flex-wrap: wrap; }

/* shared buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 11px 22px; border-radius: 50px;
  font-family: inherit; font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: all .22s; border: 1.5px solid transparent;
  white-space: nowrap;
}
.btn-dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-dark:hover { background: var(--s800); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(26,25,23,.16); }
.btn-outline { background: transparent; color: var(--ink); border-color: var(--s200); }
.btn-outline:hover { border-color: var(--s400); background: var(--s50); }
.btn-sm { padding: 9px 18px; font-size: 13px; }

/* hero mosaic */
.hero-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 200px 150px;
  gap: 12px;
}
.hcard {
  border-radius: 20px; overflow: hidden;
  cursor: pointer; transition: all .3s;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  padding: 24px 16px; position: relative;
}
.hcard:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 18px 44px rgba(0,0,0,0.09); }
.hcard.tall { grid-row: span 2; }
.hcard-balance { background: linear-gradient(155deg,#f5e6dc,#edcfbf); }
.hcard-flash   { background: linear-gradient(155deg,#dce8e4,#c8ddd9); }
.hcard-wc      { background: linear-gradient(155deg,#e4dff0,#d3cce7); }
.hcard .icon { font-size: 36px; }
.hcard .label {
  font-family: 'Playfair Display', serif;
  font-size: 15px; font-weight: 700; text-align: center; color: var(--ink);
}
.hcard .sub { font-size: 11.5px; color: var(--s600); }
.hcard .arrow {
  position: absolute; bottom: 12px; right: 12px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.65);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--ink);
}

/* section heading */
.sh {
  max-width: 1080px; margin: 0 auto;
  padding: 44px 40px 24px;
  display: flex; align-items: baseline; gap: 12px;
}
.sh-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px; font-weight: 700; letter-spacing: -.5px;
}
.sh-title em { font-style: italic; }
.sh-ct { font-size: 13px; color: var(--s400); }

/* topic grid */
.tgrid {
  max-width: 1080px; margin: 0 auto;
  padding: 0 40px 48px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr));
  gap: 14px;
}
.ttile {
  background: var(--white); border: 1.5px solid var(--s100);
  border-radius: 18px; padding: 20px;
  cursor: pointer; transition: all .24s;
  display: flex; align-items: center; gap: 14px;
}
.ttile:hover { border-color: var(--s200); box-shadow: 0 8px 26px rgba(0,0,0,.07); transform: translateY(-2px); }
.ti-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; background: var(--s50); }
.ti-nm { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.ti-ct { font-size: 12px; color: var(--s400); }

/* flash cards */
.fgrid {
  max-width: 1080px; margin: 0 auto;
  padding: 0 40px 60px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
  gap: 16px;
}
.fcard {
  background: var(--white); border: 1.5px solid var(--s100);
  border-radius: 22px; overflow: hidden;
  cursor: pointer; transition: all .26s;
}
.fcard:hover { transform: translateY(-4px); box-shadow: 0 16px 42px rgba(0,0,0,.08); border-color: var(--s200); }
.ft {
  height: 140px; display: flex; align-items: center; justify-content: center; font-size: 54px;
}
.ft-a { background: linear-gradient(145deg,#f5e6dc,#edcfbf); }
.ft-b { background: linear-gradient(145deg,#dce8e4,#c8ddd9); }
.ft-c { background: linear-gradient(145deg,#e4dff0,#d3cce7); }
.fb { padding: 18px 20px; }
.ftag {
  display: inline-block; padding: 3px 9px; border-radius: 20px;
  font-size: 10px; font-weight: 800; letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 9px;
}
.tag-h { background: #fde8e4; color: var(--coral); }
.tag-n { background: #e2f0e6; color: var(--sage); }
.tag-c { background: #ede9f6; color: var(--lav); }
.fnm { font-size: 15.5px; font-weight: 700; margin-bottom: 5px; }
.fdesc { font-size: 13px; color: var(--s600); line-height: 1.5; }

/* divider */
.hdiv { max-width:1080px; margin:0 auto; padding:0 40px; border-bottom:1px solid var(--s100); }

/* ── PLAY WRAPPER ── */
.pw { max-width: 660px; margin: 0 auto; padding: 40px 24px 80px; }
.pheader { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
.back {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--white); border: 1.5px solid var(--s100);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 15px; transition: .2s; flex-shrink: 0;
}
.back:hover { background: var(--s50); border-color: var(--s200); }
.ptopic { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }

/* progress */
.prow { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.pdots { display: flex; gap: 5px; flex: 1; }
.pdot { flex: 1; height: 3.5px; border-radius: 2px; background: var(--s100); transition: background .35s; }
.pdot.done { background: var(--ink); }
.pdot.cur { background: var(--coral); }
.pnum { font-size: 13px; color: var(--s400); font-weight: 500; white-space: nowrap; }

/* question card */
.qcard {
  background: var(--white); border: 1.5px solid var(--s100);
  border-radius: 24px; overflow: hidden;
  box-shadow: 0 4px 22px rgba(0,0,0,.05); margin-bottom: 18px;
}
.qt {
  padding: 34px 32px 26px;
  font-family: 'Playfair Display', serif;
  font-size: clamp(17px,2.4vw,23px); font-weight: 700;
  line-height: 1.45; text-align: center; color: var(--ink);
}
.crow {
  display: grid; grid-template-columns: 1fr 52px 1fr;
  border-top: 1.5px solid var(--s100);
}
.cbtn {
  padding: 26px 16px; background: none; border: none;
  cursor: pointer; font-family: inherit;
  font-size: 14.5px; font-weight: 600; color: var(--ink);
  transition: all .2s; text-align: center; line-height: 1.45;
}
.cbtn:hover { background: var(--s50); }
.cbtn.pa { background: #fff0ed; color: var(--coral); }
.cbtn.pb { background: #f2f0f9; color: var(--lav); }
.cbtn:first-child { border-right: 1px solid var(--s100); }
.cbtn:last-child { border-left: 1px solid var(--s100); }
.vsm { display: flex; align-items: center; justify-content: center;
  border-left: 1px solid var(--s100); border-right: 1px solid var(--s100); }
.vsm span {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--s100); color: var(--s600);
  display: flex; align-items: center; justify-content: center;
  font-size: 9.5px; font-weight: 800; letter-spacing: .4px;
}

/* result bars */
.rrev {
  border-top: 1.5px solid var(--s100);
  padding: 18px 26px; display: none; animation: up .3s ease;
}
.rrev.show { display: block; }
.rrw { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.rrlb { font-size: 12.5px; font-weight: 600; width: 88px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrtr { flex: 1; height: 7px; background: var(--s100); border-radius: 4px; overflow: hidden; }
.rrfi { height: 100%; border-radius: 4px; transition: width 1.1s cubic-bezier(.25,.46,.45,.94); }
.fa { background: var(--coral); } .fb { background: var(--lav); }
.rrpc { font-size: 12.5px; font-weight: 700; width: 34px; text-align: right; flex-shrink: 0; }

/* actions */
.acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.abt { padding: 11px 24px; border-radius: 50px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: .22s; border: 1.5px solid; }
.anext { background: var(--ink); color: #fff; border-color: var(--ink); }
.anext:hover { background: var(--s800); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(26,25,23,.14); }
.askip { background: transparent; color: var(--s600); border-color: var(--s100); }
.askip:hover { border-color: var(--s400); color: var(--ink); }

/* download strip */
.dlstrip {
  margin-top: 24px; background: var(--white);
  border: 1.5px solid var(--s100); border-radius: 20px;
  padding: 20px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.dlt-h { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.dlt-s { font-size: 12px; color: var(--s400); }
.dlbtn {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 20px; border-radius: 50px;
  background: var(--ink); color: #fff;
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  border: none; cursor: pointer; transition: .2s; white-space: nowrap;
}
.dlbtn:hover { background: var(--s800); transform: translateY(-1px); }

/* ── FLASH PLAY ── */
.gshell {
  background: var(--white); border: 1.5px solid var(--s100);
  border-radius: 24px; overflow: hidden;
  box-shadow: 0 4px 22px rgba(0,0,0,.05);
}
.gtop {
  padding: 15px 22px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1.5px solid var(--s100);
}
.gtitle { font-size: 15px; font-weight: 700; }
.gsc { background: var(--s50); border: 1.5px solid var(--s100); border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 700; }
canvas { display: block; width: 100%; background: var(--s50); }
.gbot {
  padding: 14px 22px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1.5px solid var(--s100); flex-wrap: wrap; gap: 10px;
}
.ghint { font-size: 12.5px; color: var(--s400); line-height: 1.5; flex: 1; }
.gctrls { display: flex; gap: 8px; }
.gbtn { padding: 8px 18px; border-radius: 50px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: .2s; border: 1.5px solid; }
.gstart { background: var(--ink); color: #fff; border-color: var(--ink); }
.gstart:hover { background: var(--s800); }
.greset { background: transparent; color: var(--ink); border-color: var(--s100); }
.greset:hover { border-color: var(--s400); }

/* ── WORLDCUP ── */
.wcstage {
  max-width: 680px; margin: 0 auto;
  padding: 0 24px 20px;
  display: flex; align-items: center; gap: 12px;
}
.stage-pill {
  display: inline-flex; align-items: center;
  padding: 5px 15px; border-radius: 50px;
  background: var(--ink); color: #fff;
  font-size: 12px; font-weight: 700; letter-spacing: .3px;
}
.stage-sub { font-size: 13px; color: var(--s400); }
.wcmatch {
  max-width: 680px; margin: 0 auto;
  padding: 0 24px 20px;
  display: grid; grid-template-columns: 1fr 44px 1fr; gap: 12px; align-items: center;
}
.wcitem {
  background: var(--white); border: 2px solid var(--s100);
  border-radius: 22px; padding: 34px 18px;
  text-align: center; cursor: pointer; transition: all .27s;
}
.wcitem:hover { border-color: var(--s300,#ccc); box-shadow: 0 12px 34px rgba(0,0,0,.08); transform: translateY(-3px); }
.wcitem.win { border-color: var(--ink); box-shadow: 0 12px 34px rgba(0,0,0,.11); }
.wce { font-size: 60px; display: block; margin-bottom: 12px; }
.wcn { font-size: 15px; font-weight: 700; }
.wvc { display: flex; align-items: center; justify-content: center; }
.wvb {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--s100); color: var(--s600);
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 800; letter-spacing: .4px;
}

/* wc result */
.rcwrap { max-width: 520px; margin: 0 auto; padding: 0 24px 80px; }
.rcard {
  background: var(--white); border: 1.5px solid var(--s100);
  border-radius: 24px; overflow: hidden;
  box-shadow: 0 4px 22px rgba(0,0,0,.05);
}
.rhead {
  padding: 36px 28px 22px;
  text-align: center; border-bottom: 1.5px solid var(--s100);
}
.rtrophy { font-size: 50px; display: block; margin-bottom: 10px; }
.rtitle { font-family:'Playfair Display',serif; font-size: 21px; font-weight: 700; margin-bottom: 8px; }
.rchamp { font-size: 26px; font-weight: 800; color: var(--coral); }
.rlist { padding: 12px 0; }
.rrow { display: flex; align-items: center; gap: 12px; padding: 11px 26px; border-bottom: 1px solid var(--s100); }
.rrow:last-child { border-bottom: none; }
.rnum { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; flex-shrink: 0; }
.r1{background:#fde8b4;color:#92610e;} .r2{background:var(--s200);color:var(--s600);}
.r3{background:#f0ddd4;color:#8b4513;} .rx{background:var(--s100);color:var(--s400);}
.rnm { font-size: 14px; font-weight: 600; flex: 1; }
.rme { font-size: 17px; }
.ract { padding: 18px 26px; display: flex; gap: 10px; justify-content: center; border-top: 1.5px solid var(--s100); }

/* RESPONSIVE */
@media(max-width:768px) {
  .nav { padding: 0 20px; }
  .nav-pills { display: none; }
  .mnav { display: grid; }
  body { padding-bottom: 68px; }
  .hero { grid-template-columns: 1fr; padding: 84px 20px 32px; gap: 28px; }
  .hero-cards { height: auto; grid-template-rows: 150px 120px; }
  .hcard.tall { grid-row: span 2; }
  .hcard .label { font-size: 13px; }
  .hcard .sub { display: none; }
  .hcard .icon { font-size: 28px; }
  .sh { padding: 32px 20px 18px; }
  .tgrid { padding: 0 20px 32px; grid-template-columns: repeat(2,1fr); }
  .fgrid { padding: 0 20px 40px; grid-template-columns: repeat(2,1fr); }
  .hdiv { padding: 0 20px; }
  .pw { padding: 32px 16px 72px; }
  .qt { padding: 24px 18px 18px; font-size: 16px; }
  .cbtn { padding: 20px 10px; font-size: 13px; }
  .wcmatch { padding: 0 16px 16px; }
  .rcwrap { padding: 0 16px 72px; }
  .wcstage { padding: 0 16px 16px; }
  .dlstrip { flex-direction: column; align-items: flex-start; }
}
@media(max-width:440px) {
  .tgrid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .fgrid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .h-ctas { flex-direction: column; }
  .wcmatch { grid-template-columns: 1fr 36px 1fr; }
  .wce { font-size: 46px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="logo" onclick="gp('home')">Ver<em>sus</em></div>
  <div class="nav-pills">
    <button class="npill on" data-p="home" onclick="gp('home')">홈</button>
    <button class="npill" data-p="balance" onclick="gp('balance')">밸런스게임</button>
    <button class="npill" data-p="flash" onclick="gp('flash')">플래시게임</button>
    <button class="npill" data-p="worldcup" onclick="gp('worldcup')">이상형 월드컵</button>
  </div>
</nav>

<div id="main">

<!-- ══════ HOME ══════ -->
<div id="page-home" class="page active">
  <div class="hero">
    <div class="hero-left aup">
      <div class="h-eyebrow">오늘의 선택</div>
      <h1 class="h-title">선택이<br>재미있어지는<br><em>순간</em></h1>
      <p class="h-body">밸런스게임, 플래시게임, 이상형 월드컵.<br>친구들과 함께라면 더욱 재밌어져요.</p>
      <div class="h-ctas">
        <button class="btn btn-dark" onclick="gp('balance')">밸런스 게임 시작</button>
        <button class="btn btn-outline" onclick="gp('worldcup')">월드컵 하러가기</button>
      </div>
    </div>
    <div class="hero-cards aup d2">
      <div class="hcard hcard-balance tall" onclick="gp('balance')">
        <div class="icon">⚖️</div>
        <div class="label">밸런스 게임</div>
        <div class="sub">둘 중 하나라면?</div>
        <div class="arrow">↗</div>
      </div>
      <div class="hcard hcard-flash" onclick="gp('flash')">
        <div class="icon">🎮</div>
        <div class="label">플래시 게임</div>
        <div class="arrow">↗</div>
      </div>
      <div class="hcard hcard-wc" onclick="gp('worldcup')">
        <div class="icon">🏆</div>
        <div class="label">이상형 월드컵</div>

function startB(id){
  cBal=BT.find(t=>t.id===id); bIdx=0; bPicked=false;
  document.getElementById('bal-sel').style.display='none';
  document.getElementById('bal-play').style.display='block';
  document.getElementById('bal-tnm').textContent=cBal.e+' '+cBal.nm;
  rBalQ();
}
function bb(){
  document.getElementById('bal-sel').style.display='block';
  document.getElementById('bal-play').style.display='none';
}
function rBalQ(){
  const q=cBal.qs[bIdx], tot=cBal.qs.length;
  document.getElementById('bal-dots').innerHTML=cBal.qs.map((_,i)=>`<div class="pdot${i<bIdx?' done':i===bIdx?' cur':''}"></div>`).join('');
  document.getElementById('bal-pnum').textContent=`${bIdx+1} / ${tot}`;
  document.getElementById('bal-q').textContent=q.q;
  document.getElementById('bal-ca').textContent=q.a;
  document.getElementById('bal-cb').textContent=q.b;
  document.getElementById('bal-ca').className='cbtn';
  document.getElementById('bal-cb').className='cbtn';
  document.getElementById('bal-res').classList.remove('show');
  document.getElementById('bskip').style.display='inline-flex';
  document.getElementById('bnext').style.display='none';
  bPicked=false;
}
function pickB(s){
  if(bPicked)return; bPicked=true;
  const q=cBal.qs[bIdx];
  document.getElementById('bal-c'+s).classList.add('p'+s);
  const rA=Math.min(99,Math.max(1,q.rA+Math.floor(Math.random()*5-2))), rB=100-rA;
  document.getElementById('rla').textContent=q.a.split(' ')[0];
  document.getElementById('rlb').textContent=q.b.split(' ')[0];
  document.getElementById('rpa').textContent=rA+'%';
  document.getElementById('rpb').textContent=rB+'%';
  document.getElementById('bal-res').classList.add('show');
  setTimeout(()=>{document.getElementById('rfa').style.width=rA+'%';document.getElementById('rfb').style.width=rB+'%';},80);
  document.getElementById('bskip').style.display='none';
  document.getElementById('bnext').style.display='inline-flex';
  if(bIdx===cBal.qs.length-1)document.getElementById('bnext').textContent='완료 🎉';
}
function nb(){
  if(bIdx>=cBal.qs.length-1){bIdx=0;rBalQ();return;}
  bIdx++;rBalQ();
}

  </div>
</div>`).join('');
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${cBal.e} ${cBal.nm} 밸런스게임</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#fafaf8;font-family:'Pretendard',sans-serif;padding:48px 20px;max-width:640px;margin:0 auto;color:#1a1917;}h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin-bottom:6px;}p.sub{color:#a8a49a;font-size:13px;margin-bottom:36px;}footer{text-align:center;color:#a8a49a;font-size:12px;margin-top:36px;}@media(max-width:480px){div[style*="grid-template-columns"]{display:block!important;}}</style></head><body><h1>${cBal.e} ${cBal.nm} 밸런스게임</h1><p class="sub">총 ${cBal.qs.length}문제 · 결과 없는 버전</p>${rows}<footer>Versus — 오프라인 밸런스게임</footer></body></html>`;
  const b=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');

}
function rfl(){if(cFlash)ofl(cFlash.id);}
function sfl(){if(!cFlash)return;if(cFlash.id==='mole')smole();else if(cFlash.id==='dodge')sdodge(true);else smem(true);}
function idleCanvas(){
  const c=document.getElementById('gc'),ctx=c.getContext('2d');
  ctx.fillStyle='#f7f6f3';ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#a8a49a';ctx.font='bold 16px Pretendard,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('▶ 시작 버튼을 눌러주세요',c.width/2,c.height/2);
}

/* — MOLE — */
let moles=[],mAct=false,mTmr=30,mSI,mTI;
function smole(){
  const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,C=4,R=3,CW=W/C,CH=H/R;
  moles=[];mAct=true;mTmr=30;fScore=0;
  document.getElementById('fscore').textContent=0;
  clearInterval(fLoop);clearInterval(mSI);clearInterval(mTI);
  function spawn(){
    if(!mAct)return;
    const id=Date.now()+Math.random(),life=650+Math.random()*900;
    moles.push({c:Math.floor(Math.random()*C),r:Math.floor(Math.random()*R),id,born:Date.now(),life,hit:false});
    setTimeout(()=>{moles=moles.filter(m=>m.id!==id);},life);
  }
  function draw(){
    ctx.fillStyle='#f7f6f3';ctx.fillRect(0,0,W,H);
    for(let i=1;i<R;i++){ctx.beginPath();ctx.moveTo(0,i*CH);ctx.lineTo(W,i*CH);ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;ctx.stroke();}
    for(let i=1;i<C;i++){ctx.beginPath();ctx.moveTo(i*CW,0);ctx.lineTo(i*CW,H);ctx.stroke();}
    moles.forEach(m=>{
      const x=m.c*CW+CW/2,y=m.r*CH+CH/2,age=(Date.now()-m.born)/m.life;
      ctx.globalAlpha=Math.max(0,1-Math.pow(age,1.5));
      ctx.font=Math.floor(CW*.42)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(m.hit?'💥':'🦔',x,y);ctx.globalAlpha=1;
    });
    ctx.fillStyle='rgba(247,246,243,.88)';ctx.fillRect(0,0,W,44);
    ctx.fillStyle='#1a1917';ctx.font='bold 14px Pretendard,sans-serif';
    ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('⏱ '+mTmr+'초',14,22);
    ctx.textAlign='right';ctx.fillText('점수 '+fScore,W-14,22);
  }
  cv.onclick=e=>{
    if(!mAct)return;
    const rc=cv.getBoundingClientRect(),mx=(e.clientX-rc.left)*(W/rc.width),my=(e.clientY-rc.top)*(H/rc.height);
    for(let i=moles.length-1;i>=0;i--){
      const m=moles[i];if(m.hit)continue;
      if(Math.abs(mx-(m.c*CW+CW/2))<CW*.42&&Math.abs(my-(m.r*CH+CH/2))<CH*.42){
        m.hit=true;fScore++;document.getElementById('fscore').textContent=fScore;
        setTimeout(()=>{moles=moles.filter(x=>x!==m);},240);break;
      }
    }
  };
  mSI=setInterval(spawn,570);
  mTI=setInterval(()=>{
    mTmr--;if(mTmr>0)return;
    mAct=false;clearInterval(mSI);clearInterval(mTI);clearInterval(fLoop);moles=[];
    ctx.fillStyle='rgba(247,246,243,.94)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1a1917';ctx.font='bold 24px Pretendard,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🎉 최종 점수: '+fScore+'점',W/2,H/2-14);
    ctx.fillStyle='#a8a49a';ctx.font='14px Pretendard,sans-serif';
    ctx.fillText('재시작 버튼을 눌러주세요',W/2,H/2+20);
  },1000);
  fLoop=setInterval(draw,1000/30);
}

/* — DODGE — */
let dX=320,dY=370,dMX=320,dMY=370,dObs=[],dAct=false,dT=0;
function sdodge(go){
  const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  if(!go){idleCanvas();return;}
  dX=W/2;dY=H-55;dMX=W/2;dMY=H-55;dObs=[];dAct=true;dT=0;fScore=0;
  document.getElementById('fscore').textContent=0;
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect();dMX=(e.clientX-r.left)*(W/r.width);dMY=(e.clientY-r.top)*(H/r.height);};
  cv.ontouchmove=e=>{e.preventDefault();const t=e.touches[0],r=cv.getBoundingClientRect();dMX=(t.clientX-r.left)*(W/r.width);dMY=(t.clientY-r.top)*(H/r.height);};
  let obT=0;
  clearInterval(fLoop);
  fLoop=setInterval(()=>{
    if(!dAct)return;
    dT++;fScore=Math.floor(dT/5);document.getElementById('fscore').textContent=fScore;
    dX+=(dMX-dX)*.15;dY+=(dMY-dY)*.15;
    obT++;const sp=Math.max(16,52-Math.floor(dT/80));
    if(obT>sp){obT=0;dObs.push({x:20+Math.random()*(W-40),y:-28,r:15+Math.random()*12,v:1.7+Math.random()*2+dT/260});}
    dObs.forEach(o=>o.y+=o.v);dObs=dObs.filter(o=>o.y<H+40);
    dObs.forEach(o=>{if(Math.hypot(dX-o.x,dY-o.y)<o.r+12)dAct=false;});
    ctx.fillStyle='#f7f6f3';ctx.fillRect(0,0,W,H);
    dObs.forEach(o=>{
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
      ctx.fillStyle='#e8614a';ctx.globalAlpha=.82;ctx.fill();ctx.globalAlpha=1;
    });
    ctx.font='26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚀',dX,dY);
    ctx.fillStyle='rgba(247,246,243,.85)';ctx.fillRect(0,0,W,44);
    ctx.fillStyle='#1a1917';ctx.font='bold 14px Pretendard,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText('점수 '+fScore,W-14,22);
    if(!dAct){
      clearInterval(fLoop);
      ctx.fillStyle='rgba(247,246,243,.94)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#e8614a';ctx.font='bold 24px Pretendard,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💥 Game Over!',W/2,H/2-18);
      ctx.fillStyle='#1a1917';ctx.font='bold 17px Pretendard,sans-serif';ctx.fillText('최종 점수: '+fScore+'점',W/2,H/2+16);
      ctx.fillStyle='#a8a49a';ctx.font='13px Pretendard,sans-serif';ctx.fillText('재시작 버튼을 눌러주세요',W/2,H/2+48);
    }
  },1000/60);
}

/* — MEMORY — */
let mS=[],mI=[],mPh='idle',mLv=1;
function smem(go){
  const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,C=3,R=3,CW=W/C,CH=H/R;
  const CLR=['#e8614a','#7a9e7e','#9b8ec4','#d4956a','#4e9fcf','#c8d86c','#e87ca4','#6cb8d4','#c87a4e'];
  mS=[];mI=[];mPh='idle';mLv=1;fScore=0;
  function idx(c,r){return r*C+c;}
  function dg(hl=-1,ih=-1){
    ctx.fillStyle='#f7f6f3';ctx.fillRect(0,0,W,H);
    for(let r2=0;r2<R;r2++)for(let c2=0;c2<C;c2++){
      const i=idx(c2,r2),x=c2*CW+5,y=r2*CH+5,w=CW-10,h=CH-10;
      const lit=hl===i||ih===i;
      ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,10);else ctx.rect(x,y,w,h);
      ctx.fillStyle=lit?CLR[i]:'#fff';ctx.fill();
      ctx.strokeStyle=lit?CLR[i]:'#eeede9';ctx.lineWidth=lit?2:1.5;ctx.stroke();
      if(lit){ctx.shadowColor=CLR[i];ctx.shadowBlur=16;}ctx.shadowBlur=0;
    }
    ctx.fillStyle='rgba(247,246,243,.9)';ctx.fillRect(0,0,W,44);
    ctx.fillStyle='#1a1917';ctx.font='bold 13px Pretendard,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('레벨 '+mLv,14,22);ctx.textAlign='right';ctx.fillText('점수 '+fScore,W-14,22);
  }
  function ov(msg,col){ctx.fillStyle='rgba(247,246,243,.86)';ctx.fillRect(0,H/2-26,W,52);ctx.fillStyle=col;ctx.font='bold 17px Pretendard,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg,W/2,H/2);}
  function showS(){
    mPh='show';let i=0;
    function nx(){if(i>=mS.length){dg();ov('이제 입력하세요!','#7a9e7e');setTimeout(()=>{dg();mPh='input';mI=[];},650);return;}dg(mS[i]);setTimeout(()=>{dg();setTimeout(()=>{i++;nx();},140);},520);}
    dg();ov('패턴을 기억하세요!','#d4956a');setTimeout(nx,650);
  }
  if(!go){dg();ov('시작 버튼을 눌러주세요 🧠','#a8a49a');return;}
  mS=[Math.floor(Math.random()*9)];dg();setTimeout(showS,350);
  cv.onclick=e=>{
    if(mPh!=='input')return;
    const rc=cv.getBoundingClientRect(),mx=(e.clientX-rc.left)*(W/rc.width),my=(e.clientY-rc.top)*(H/rc.height);
    const c2=Math.floor(mx/CW),r2=Math.floor(my/CH);
    if(c2<0||c2>=C||r2<0||r2>=R)return;
    const i=idx(c2,r2);dg(-1,i);setTimeout(()=>dg(),170);
    mI.push(i);
    if(mI[mI.length-1]!==mS[mI.length-1]){mPh='idle';ov('❌ 틀렸습니다!','#e8614a');setTimeout(()=>{dg();ov('시작 버튼으로 재시작하세요','#a8a49a');},1300);return;}
    if(mI.length===mS.length){mPh='idle';fScore+=mLv;mLv++;document.getElementById('fscore').textContent=fScore;ov('✅ 정답!','#7a9e7e');mS.push(Math.floor(Math.random()*9));setTimeout(showS,850);}
  };
}

/* ═════ WORLDCUP ═════ */
function startWC(id){
  cWC=WC.find(t=>t.id===id);
  wcRnd=[...cWC.items].sort(()=>Math.random()-.5);
  wcNxt=[];wcPr=0;wcLost=[];
  document.getElementById('wc-sel').style.display='none';
  document.getElementById('wc-play').style.display='block';
  document.getElementById('wc-res').style.display='none';
  swcm();
}
function swcm(){
  const tot=wcRnd.length,nm=tot<=2?'결승':tot<=4?'4강':tot<=8?'8강':`${tot}강`;
  document.getElementById('wc-stg').textContent=nm;
  document.getElementById('wc-mi').textContent=`${wcPr+1} / ${Math.floor(tot/2)} 경기`;
  const a=wcRnd[wcPr*2],b=wcRnd[wcPr*2+1];
  document.getElementById('wc-ea').textContent=a.e;document.getElementById('wc-na').textContent=a.n;
  document.getElementById('wc-eb').textContent=b.e;document.getElementById('wc-nb').textContent=b.n;
  document.getElementById('wc-ia').classList.remove('win');document.getElementById('wc-ib').classList.remove('win');
}
function pw(s){
  const a=wcRnd[wcPr*2],b=wcRnd[wcPr*2+1],w=s==='a'?a:b,l=s==='a'?b:a;
  document.getElementById('wc-i'+s).classList.add('win');
  wcLost.push(l);wcNxt.push(w);
  setTimeout(()=>{
    wcPr++;
    if(wcPr*2>=wcRnd.length){
      if(wcNxt.length===1)swcr(wcNxt[0]);
      else{wcRnd=wcNxt;wcNxt=[];wcPr=0;swcm();}
    }else swcm();
  },450);
}
function swcr(champ){
  document.getElementById('wc-play').style.display='none';
  document.getElementById('wc-res').style.display='block';
  document.getElementById('wc-cn').textContent=champ.e+' '+champ.n;
  const all=[champ,...wcLost.reverse()];
  document.getElementById('wc-rl').innerHTML=all.map((it,i)=>{
    const cls=i===0?'r1':i===1?'r2':i===2?'r3':'rx';
    const md=i===0?'👑':i===1?'🥈':i===2?'🥉':'';
    return `<div class="rrow"><div class="rnum ${cls}">${i+1}</div><span style="font-size:21px">${it.e}</span><span class="rnm">${it.n}</span><span class="rme">${md}</span></div>`;
  }).join('');
}
function bwc(){
  document.getElementById('wc-sel').style.display='block';
  document.getElementById('wc-play').style.display='none';
  document.getElementById('wc-res').style.display='none';
}
function rwc(){document.getElementById('wc-res').style.display='none';document.getElementById('wc-play').style.display='block';startWC(cWC.id);}

/* init */
rHome();
</script>
