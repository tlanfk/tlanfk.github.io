<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 설정</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1e1e1e;
            overflow: hidden;
        }

        #canvas-container {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }

        canvas {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            touch-action: none;
        }

        /* 오버레이 스타일 최적화 */
        #mapOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            /* 배경 조금 더 어둡게 */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            z-index: 1000;
        }

        #mapOverlay img {
            max-width: 90%;
            max-height: 70%;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .button-group {
            display: flex;
            gap: 15px;
        }

        /* 버튼 공통 스타일 */
        .overlay-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .overlay-btn:hover {
            transform: scale(1.05);
        }

        /* 깃허브 링크 버튼 스타일 */
        #githubBtn {
            background-color: #2ea44f;
            color: #fff;
        }

        #githubBtn:hover {
            background-color: #2c974b;
        }

        /* 뒤로가기 버튼 스타일 */
        #overlayBackBtn {
            background-color: #fff;
            color: #333;
        }

        #overlayBackBtn:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="mapOverlay">
        <img src="image/bag_map.png" alt="맵 정보">
        <div class="button-group">
            <a id="githubBtn" class="overlay-btn" href="https://github.com/tlanfk/bag_map" target="_blank">
                배틀그라운드 지도 간편하게 보기
            </a>
            <button id="overlayBackBtn" class="overlay-btn">뒤로</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
